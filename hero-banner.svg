<svg width="100%" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="35%" stop-color="#0d1b3d"/>
      <stop offset="65%" stop-color="#1a1b4b"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DCFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DCFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7DCFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef3ff"/>
      <stop offset="50%" stop-color="#7DCFFF"/>
      <stop offset="100%" stop-color="#eef3ff"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- constellation lines -->
  <g stroke="#7DCFFF" stroke-width="1" opacity="0.18">
    <line x1="40" y1="60" x2="140" y2="110"/>
    <line x1="140" y1="110" x2="90" y2="180"/>
    <line x1="850" y1="50" x2="930" y2="100"/>
    <line x1="930" y1="100" x2="880" y2="170"/>
    <line x1="60" y1="230" x2="150" y2="250"/>
    <line x1="820" y1="220" x2="900" y2="260"/>
  </g>

  <!-- twinkling stars -->
  <g fill="#FFD700">
    <circle cx="40" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="110" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="180" r="2.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="100" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="170" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="250" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="260" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="35" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- torii gate left -->
  <g stroke="#7DCFFF" stroke-width="4" fill="none" filter="url(#softGlow)" opacity="0.85">
    <line x1="55" y1="90" x2="55" y2="250"/>
    <line x1="115" y1="90" x2="115" y2="250"/>
    <line x1="35" y1="95" x2="135" y2="95"/>
    <line x1="45" y1="115" x2="125" y2="115"/>
  </g>

  <!-- torii gate right -->
  <g stroke="#7DCFFF" stroke-width="4" fill="none" filter="url(#softGlow)" opacity="0.85">
    <line x1="865" y1="90" x2="865" y2="250"/>
    <line x1="925" y1="90" x2="925" y2="250"/>
    <line x1="845" y1="95" x2="945" y2="95"/>
    <line x1="855" y1="115" x2="935" y2="115"/>
  </g>

  <!-- moving light sweep -->
  <rect x="-300" y="0" width="300" height="300" fill="url(#sweep)">
    <animate attributeName="x" values="-300;1000" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="500" y="160" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="72" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">DHRUV</text>

  <!-- underline sweep -->
  <line x1="330" y1="185" x2="670" y2="185" stroke="#7DCFFF" stroke-width="2" opacity="0.7">
    <animate attributeName="x1" values="500;330;500" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="500;670;500" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- subtitle -->
  <text x="500" y="220" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="17" letter-spacing="3" fill="#8ab4ff">FULL-STACK DEVELOPER · OPEN SOURCE · BUILDER</text>
</svg>
