<svg width="100%" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b3d"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="640" height="320" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="640" height="320" fill="url(#termBg)"/>
    <rect width="640" height="320" fill="none" stroke="#7DCFFF" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- title bar -->
    <rect x="0" y="0" width="640" height="34" fill="#0a1330"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="320" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8ab4ff">dhruv@dev-machine: ~/about-me</text>

    <!-- prompt lines, typed in sequence -->
    <g font-family="'JetBrains Mono', monospace" font-size="15" fill="#eef3ff">
      <text x="22" y="66"><tspan fill="#7DCFFF">$</tspan> whoami
        <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="22" y="94" fill="#FFD700" opacity="0">Dhruv — Full-Stack Developer
        <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
      </text>

      <text x="22" y="130" opacity="0"><tspan fill="#7DCFFF">$</tspan> cat focus.txt
        <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="22" y="156" opacity="0">→ System design, cloud-native architecture,
        <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="22" y="178" opacity="0">  open-source contribution
        <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
      </text>

      <text x="22" y="214" opacity="0"><tspan fill="#7DCFFF">$</tspan> echo $CURRENTLY_LEARNING
        <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="22" y="240" opacity="0">Advanced System Design · DevOps · ML fundamentals
        <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.4s" fill="freeze"/>
      </text>

      <text x="22" y="276" opacity="0"><tspan fill="#7DCFFF">$</tspan> status --joke
        <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="22" y="298" fill="#8ab4ff" opacity="0">"I write more code than docs... this IS docs" 🤣
        <animate attributeName="opacity" from="0" to="1" begin="4.7s" dur="0.4s" fill="freeze"/>
      </text>
    </g>

    <!-- blinking cursor -->
    <rect x="22" y="285" width="9" height="16" fill="#7DCFFF" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.5;0.55" begin="5.3s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
